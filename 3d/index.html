const scene=new THREE.Scene();scene.background=new THREE.Color(0x090c20);scene.fog=new THREE.FogExp2(0x10152b,.027);

scene.add(new THREE.HemisphereLight(0x9bc7ff,0x242036,2));
const sun=new THREE.DirectionalLight(0xc8b0ff,2.8);sun.position.set(-5,11,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);

const material=(color,metalness=.2,roughness=.42)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
const floorMat=material(0x26203e,.55,.65),wallMat=material(0x272043,.48,.6);

const floor=block(36,.5,36,0,-.28,0,floorMat);floor.castShadow=false;
const grid=new THREE.GridHelper(36,36,0x7047a8,0x413267);grid.position.y=.01;scene.add(grid);
for(let i=-15;i<=15;i+=6){const p=block(2,.12,2,i,0.02,-14,material(0x40315c));p.castShadow=false}
for(const z of [-17.5,17.5]){block(36,2,.7,0,1,z,wallMat)}
for(const x of [-17.5,17.5]){block(.7,2,36,x,1,0,wallMat)}
const glowMat=new THREE.MeshBasicMaterial({color:0x9c64ff});
for(const z of [-17,17])block(34,.09,.15,0,1.35,z,glowMat);
for(const x of [-17,17])block(.15,.09,34,x,1.35,0,glowMat);
for(const [x,z] of [[-14,-14],[14,-14],[-14,14],[14,14]]){
 const pillar=block(1.1,5,1.1,x,2.5,z,material(0x30245c));block(1.25,.12,1.25,x,4.7,z,new THREE.MeshBasicMaterial({color:0x55e5ff}));
}
const ringMat=new THREE.MeshBasicMaterial({color:0x7153f8,side:THREE.DoubleSide});const ring=new THREE.Mesh(new THREE.RingGeometry(6.5,6.58,72),ringMat);ring.rotation.x=-Math.PI/2;ring.position.y=.035;scene.add(ring);
const sphere=(r,m,x,y,z,parent)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o};
function actor(isHero){
 const root=new THREE.Group();scene.add(root);
 const armor=material(isHero?0x278fcf:0xad3456,.55,.31),dark=material(0x20233e,.45,.42),trim=material(isHero?0xd1c1ff:0xffb08f,.55,.3);
 const glow=new THREE.MeshBasicMaterial({color:isHero?0x5ff7ff:0xff805a});
 const torso=block(1.02,1.24,.62,0,1.87,0,armor,root);
 block(1.25,.22,.82,0,2.39,0,trim,root);
 block(.84,.26,.16,0,1.9,.39,trim,root);
 block(.35,.39,.08,0,1.93,.50,glow,root);
 // Shaped breastplate and glowing equipment
 block(.82,.31,.12,0,2.19,.38,armor,root);
 for(const x of [-.32,.32])block(.19,.55,.10,x,1.7,.37,trim,root);
 // Head and visor face the +Z direction, so moving forward never reverses it.
 const head=new THREE.Group();head.position.set(0,2.98,0);root.add(head);
 block(.88,.76,.79,0,0,0,trim,head);
 block(.97,.18,.82,0,.38,0,armor,head);
 block(.7,.2,.1,0,.06,.43,dark,head);
 block(.55,.095,.065,0,.08,.5,glow,head);
 for(const x of [-.34,.34])block(.12,.32,.17,x,-.14,.39,armor,head);
 const arms=[];
 for(const x of [-.75,.75]){
   const arm=new THREE.Group();arm.position.set(x,2.28,0);root.add(arm);
   block(.42,.69,.52,0,-.37,0,armor,arm);
   block(.48,.20,.57,0,-.08,0,trim,arm);
   block(.35,.32,.40,0,-.76,.07,dark,arm);
   arms.push(arm);
 }
 const legs=[];
 for(const x of [-.32,.32]){
   const leg=new THREE.Group();leg.position.set(x,1.19,0);root.add(leg);
   block(.38,.80,.46,0,-.39,0,dark,leg);
   block(.48,.19,.57,0,-.69,.04,armor,leg);
   block(.47,.20,.65,0,-.97,.11,trim,leg);
   legs.push(leg);
 }
 const hand=new THREE.Group();hand.position.set(0,-.62,.12);arms[1].add(hand);
 if(isHero){
   // Translucent emissive energy blade with visible guard and grip.
   const edge=new THREE.MeshBasicMaterial({color:0x8efaff});
   const blade=block(.12,1.6,.15,0,1.02,.05,edge,hand);
   block(.51,.10,.30,0,.18,.05,trim,hand);
   block(.19,.45,.19,0,-.06,.05,dark,hand);
   blade.castShadow=false;
 }else{
   block(.4,.32,.45,0,-.15,.1,trim,hand);
   sphere(.20,glow,0,-.25,.35,hand);
 }
 const core=sphere(.16,glow,0,1.94,.51,root);
 const shadow=new THREE.Mesh(new THREE.CircleGeometry(.90,28),new THREE.MeshBasicMaterial({color:0x050512,transparent:true,opacity:.38,depthWrite:false}));
 shadow.rotation.x=-Math.PI/2;shadow.position.y=.02;root.add(shadow);
 return {root,hand,torso,core,arms,legs,head,shadow};
}
const hero=actor(true),enemy=actor(false);hero.root.position.set(0,0,6);enemy.root.position.set(0,0,-5);
const hitFlash=new THREE.PointLight(0xffe58a,0,5);scene.add(hitFlash);
const effectMat=new THREE.MeshBasicMaterial({color:0xffe38a,transparent:true,opacity:.8,depthWrite:false});
const hitOrb=sphere(.35,effectMat,0,1.8,0,scene);hitOrb.visible=false;
const slashMat=new THREE.MeshBasicMaterial({color:0x78f5ff,transparent:true,opacity:.86,side:THREE.DoubleSide,depthWrite:false});
const slashArc=new THREE.Mesh(new THREE.TorusGeometry(1.0,.065,7,28,Math.PI*1.15),slashMat);
scene.add(slashArc);slashArc.visible=false;
const dashTrail=new THREE.Mesh(new THREE.RingGeometry(.58,.70,32),new THREE.MeshBasicMaterial({color:0x8d9dff,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false}));
dashTrail.rotation.x=-Math.PI/2;dashTrail.position.y=.055;dashTrail.visible=false;scene.add(dashTrail);
let camHeading=Math.PI, orbitOffset=0, orbitPointer=null,orbitLastX=0;
const viewport=$('view');
viewport.addEventListener('pointerdown',e=>{orbitPointer=e.pointerId;orbitLastX=e.clientX;viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(orbitPointer!==e.pointerId)return;orbitOffset=THREE.MathUtils.clamp(orbitOffset-(e.clientX-orbitLastX)*.006,-2.2,2.2);orbitLastX=e.clientX});
viewport.addEventListener('pointerup',e=>{if(orbitPointer===e.pointerId)orbitPointer=null});
viewport.addEventListener('pointercancel',e=>{if(orbitPointer===e.pointerId)orbitPointer=null});
const deltaAngle=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
let hp=100,enemyHP=100,wins=0,playing=true,lastAttack=0,lastDodge=0,lastEnemyAttack=0,attackAnim=0,enemyAnim=0,dodgeUntil=0,damageFlash=0,popUntil=0,messageTimeout=0;
let stickX=0,stickY=0,joyPointer=null;const joy=$('joystick'),knob=$('stick');
function joystick(e){const rect=joy.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,r=rect.width*.34,length=Math.hypot(dx,dy),scale=Math.min(1,r/Math.max(length,1));stickX=dx*scale/r;stickY=dy*scale/r;knob.style.transform=`translate(calc(-50% + ${dx*scale}px),calc(-50% + ${dy*scale}px))`}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);joystick(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joystick(e)});
function clearJoy(e){if(e&&joyPointer!==e.pointerId)return;joyPointer=null;stickX=stickY=0;knob.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerup',clearJoy);joy.addEventListener('pointercancel',clearJoy);window.addEventListener('blur',()=>clearJoy());
function say(text){$('message').textContent=text;$('message').classList.add('show');clearTimeout(messageTimeout);messageTimeout=setTimeout(()=>$('message').classList.remove('show'),650)}
function ui(){$('heroHp').textContent=Math.max(0,Math.ceil(hp))+' HP';$('heroBar').style.width=Math.max(0,hp)+'%';$('enemyHp').textContent=Math.max(0,Math.ceil(enemyHP))+' HP';$('enemyBar').style.width=Math.max(0,enemyHP)+'%'}
function stop(win){playing=false;$('overlay').hidden=false;$('resultIcon').textContent=win?'🏆':'💔';$('resultTitle').textContent=win?'ПОБЕДА!':'ПОРАЖЕНИЕ';$('resultText').textContent=win?'Страж побеждён. Ты успешно прошёл первую 3D-арену!':'Страж оказался сильнее. Попробуй уклоняться перед ударами.';if(win){wins++;try{localStorage.setItem('skinforge_3d_demo_v20',String(wins))}catch{}}}
function reset(){hp=enemyHP=100;playing=true;orbitOffset=0;camHeading=Math.PI;slashArc.visible=false;dashTrail.visible=false;hero.root.position.set(0,0,6);enemy.root.position.set(0,0,-5);lastAttack=lastDodge=lastEnemyAttack=0;attackAnim=enemyAnim=0;dodgeUntil=0;$('overlay').hidden=true;ui();say('БОЙ НАЧАЛСЯ')}
$('start').addEventListener('click',reset);$('again').addEventListener('click',reset);
$('attack').addEventListener('pointerdown',e=>{
 e.preventDefault();if(!playing)return;
 const now=performance.now();if(now-lastAttack<490)return;
 lastAttack=now;attackAnim=now;
 const dist=hero.root.position.distanceTo(enemy.root.position);
 // Let the player turn toward the opponent during the slash.
 const dx=enemy.root.position.x-hero.root.position.x,dz=enemy.root.position.z-hero.root.position.z;
 const heading=Math.atan2(dx,dz);hero.root.rotation.y+=deltaAngle(hero.root.rotation.y,heading)*.82;
 slashArc.position.copy(hero.root.position).add(new THREE.Vector3(Math.sin(heading)*1.5,1.75,Math.cos(heading)*1.5));
 slashArc.rotation.set(0,-heading,.4);slashArc.visible=true;
 if(dist<3.2){
  enemyHP=Math.max(0,enemyHP-20);damageFlash=now;
  hitOrb.position.copy(enemy.root.position).add(new THREE.Vector3(0,1.7,0));
  hitOrb.visible=true;popUntil=now+190;hitFlash.position.copy(hitOrb.position);
  say('⚔️ −20 HP');ui();if(enemyHP<=0)stop(true)
 }else say('ПОДОЙДИ БЛИЖЕ');
});
$('dodge').addEventListener('pointerdown',e=>{
 e.preventDefault();if(!playing)return;
 const now=performance.now();if(now-lastDodge<1800)return;
 lastDodge=now;dodgeUntil=now+560;
 const forward=-stickY,side=stickX;const yaw=camHeading+orbitOffset;
 const vx=Math.sin(yaw)*forward+Math.cos(yaw)*side;
 const vz=Math.cos(yaw)*forward-Math.sin(yaw)*side;
 const len=Math.hypot(vx,vz);
 const dx=len>.1?vx/len:Math.sin(hero.root.rotation.y),dz=len>.1?vz/len:Math.cos(hero.root.rotation.y);
 hero.root.position.x=THREE.MathUtils.clamp(hero.root.position.x+dx*2.8,-14,14);
 hero.root.position.z=THREE.MathUtils.clamp(hero.root.position.z+dz*2.8,-14,14);

function tick(now){

 let moving=false,speedFactor=0;
 if(playing){
  const forward=-stickY,side=stickX,input=Math.hypot(forward,side);
  moving=input>.08;

   const yaw=camHeading+orbitOffset;
   const vx=Math.sin(yaw)*forward+Math.cos(yaw)*side;
   const vz=Math.cos(yaw)*forward-Math.sin(yaw)*side;
   const dir=Math.atan2(vx,vz);
   hero.root.rotation.y+=deltaAngle(hero.root.rotation.y,dir)*Math.min(1,dt*11);
   speedFactor=Math.min(1,input);
   const speed=4.7+speedFactor*2.5;
   hero.root.position.x=THREE.MathUtils.clamp(hero.root.position.x+vx*speed*dt,-15.1,15.1);
   hero.root.position.z=THREE.MathUtils.clamp(hero.root.position.z+vz*speed*dt,-15.1,15.1);
  }
  const dx=hero.root.position.x-enemy.root.position.x;
  const dz=hero.root.position.z-enemy.root.position.z;
  const dist=Math.hypot(dx,dz);
  enemy.root.rotation.y+=deltaAngle(enemy.root.rotation.y,Math.atan2(dx,dz))*Math.min(1,dt*7);
  if(dist>2.25){const speed=2.25;enemy.root.position.x+=dx/dist*speed*dt;enemy.root.position.z+=dz/dist*speed*dt}
  else if(now-lastEnemyAttack>1550){
   lastEnemyAttack=now;enemyAnim=now;
   if(now>dodgeUntil){hp=Math.max(0,hp-11);say('−11 HP');ui();if(hp<=0)stop(false)}
   else say('УКЛОН!');
  }
  const stride=Math.sin(now*.012);
  const walk=moving?speedFactor:0;
  hero.torso.position.y=1.87+(moving?Math.abs(stride)*.08:Math.sin(now*.002)*.024);
  hero.legs[0].rotation.x=stride*.55*walk;
  hero.legs[1].rotation.x=-stride*.55*walk;
  hero.arms[0].rotation.x=-stride*.3*walk;
  hero.arms[1].rotation.x=stride*.18*walk;
  const strike=now-attackAnim<330?Math.sin((now-attackAnim)/330*Math.PI):0;
  hero.arms[1].rotation.x=-strike*2.0+stride*.18*walk;
  hero.arms[1].rotation.z=-strike*.32;
  hero.torso.rotation.z=moving?-stride*.035*walk:0;
  enemy.legs[0].rotation.x=Math.sin(now*.008)*.35*(dist>2.25?1:0);
  enemy.legs[1].rotation.x=-enemy.legs[0].rotation.x;
  enemy.arms[0].rotation.x=-enemy.legs[0].rotation.x*.4;
  enemy.arms[1].rotation.x=now-enemyAnim<340?-Math.sin((now-enemyAnim)/340*Math.PI)*1.8:0;
  enemy.torso.material.emissive.setHex(now-damageFlash<160?0x551c1c:0x000000);
 }
 if(now>popUntil)hitOrb.visible=false;
 hitFlash.intensity=hitOrb.visible?16:0;
 if(now-lastAttack>340)slashArc.visible=false;
 else if(slashArc.visible){
  const t=Math.min(1,Math.max(0,(now-lastAttack)/340));
  slashArc.scale.setScalar(.65+t*.75);
  slashArc.rotation.z=t*2.2-.8;
  slashMat.opacity=(1-t)*.85;
 }
 dashTrail.visible=now<dodgeUntil;
 if(dashTrail.visible){dashTrail.scale.setScalar(1+(dodgeUntil-now)/560*.4)}
 // Camera trails smoothly behind the character, with optional finger orbit.
 camHeading+=deltaAngle(camHeading,hero.root.rotation.y)*Math.min(1,dt*2.4);
 const camYaw=camHeading+orbitOffset;
